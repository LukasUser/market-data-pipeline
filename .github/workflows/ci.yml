name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC Release,        os: ubuntu-24.04, cxx: g++,     build_type: Release, sanitize: OFF }
          - { name: Linux GCC ASan+UBSan,     os: ubuntu-24.04, cxx: g++,     build_type: Debug,   sanitize: ON }
          - { name: Linux Clang Release,      os: ubuntu-24.04, cxx: clang++, build_type: Release, sanitize: OFF }
          - { name: Linux Clang ASan+UBSan,   os: ubuntu-24.04, cxx: clang++, build_type: Debug,   sanitize: ON }
          - { name: macOS Clang Release,      os: macos-15,     cxx: clang++, build_type: Release, sanitize: OFF }
          - { name: macOS Clang ASan+UBSan,   os: macos-15,     cxx: clang++, build_type: Debug,   sanitize: ON }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DITCH_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
